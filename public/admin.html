<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clock Admin</title>
    <link rel="stylesheet" href="/static/css/admin.css">
  </head>
  <body>
    <header class="admin-header">
      <div>
        <h1>Pi Clock Admin</h1>
        <p>Configure the fullscreen Raspberry Pi display.</p>
      </div>
      <nav>
        <a href="/" target="_blank">Preview current face</a>
        <form method="post" action="/admin/logout"><button type="submit">Log out</button></form>
      </nav>
    </header>

    <main class="admin-layout">
      <form id="configForm" class="settings">
        <section>
          <h2>Time</h2>
          <div class="grid">
            <label>Timezone <input name="display.timezone" required value="America/Denver"></label>
            <label>Hour mode <select name="display.hourMode"><option value="12">12-hour</option><option value="24">24-hour</option></select></label>
            <label>Date format <input name="display.dateFormat" required></label>
            <label>Date position <select name="display.datePosition"><option>below</option><option>above</option><option>left</option><option>right</option></select></label>
          </div>
          <label class="check"><input type="checkbox" name="display.showSeconds"> Show seconds</label>
          <label class="check"><input type="checkbox" name="display.showDate"> Show date</label>
        </section>

        <section>
          <h2>Clock Face</h2>
          <div class="grid">
            <label>Face <select name="face.type"><option value="sevenSegment">Seven-segment</option><option value="nixie">Nixie</option><option value="modern">Modern</option><option value="photo">Photo</option></select></label>
            <label data-show-when="face.type:sevenSegment,nixie">Theme <select name="face.theme"><option>red</option><option>green</option><option>amber</option><option>blue</option><option>white</option></select></label>
            <label data-show-when="face.type:modern">Modern font <select name="face.modern.font"><option value="systemSans">DejaVu Sans</option><option value="systemSerif">DejaVu Serif</option><option value="monospace">DejaVu Sans Mono</option><option value="rounded">DejaVu Sans alternate</option></select></label>
            <label data-show-when="face.type:modern">Font scale <input type="number" step="0.05" min="0.6" max="1.6" name="face.modern.fontScale"></label>
            <label data-show-when="face.type:modern">Text color <input type="color" name="face.modern.color"></label>
            <label data-show-when="face.type:modern">Background <input type="color" name="face.modern.backgroundColor"></label>
          </div>
        </section>

        <section>
          <h2>Weather</h2>
          <label class="check"><input type="checkbox" name="weather.enabled"> Show weather</label>
          <div class="grid">
            <label>Location label <input name="weather.locationLabel"></label>
            <label>Latitude <input type="number" step="0.0001" name="weather.latitude"></label>
            <label>Longitude <input type="number" step="0.0001" name="weather.longitude"></label>
            <label>Units <select name="weather.units"><option value="fahrenheit">Fahrenheit</option><option value="celsius">Celsius</option></select></label>
            <label>Cache minutes <input type="number" min="5" max="180" name="weather.cacheTtlMinutes"></label>
          </div>
          <button type="button" data-test="weather-location">Detect location</button>
          <button type="button" data-test="weather">Test weather</button>
          <output id="weatherStatus"></output>
        </section>

        <section data-show-when="face.type:photo">
          <h2>Photos</h2>
          <div class="grid">
            <label>Source <select name="face.photo.source"><option>local</option><option>icloud</option><option>immich</option></select></label>
            <label data-photo-source="local">Local folder <input name="face.photo.localFolder"></label>
            <label data-photo-source="icloud">iCloud public URL <input type="url" name="face.photo.icloudUrl"></label>
            <label data-photo-source="immich">Immich server URL <input type="url" name="face.photo.immichServerUrl"></label>
            <label data-photo-source="immich">Immich album ID <input name="face.photo.immichAlbumId"></label>
            <label data-photo-source="immich">Immich API key <input type="password" name="providers.immich.apiKey" autocomplete="off" placeholder="Leave blank to keep current key"></label>
            <label>Rotation seconds <input type="number" min="5" max="3600" name="face.photo.rotationIntervalSeconds"></label>
            <label>Overlay position <select name="face.photo.overlayPosition"><option>bottom-left</option><option>bottom-right</option><option>top-left</option><option>top-right</option><option>center</option></select></label>
            <label>Overlay opacity <input type="number" step="0.05" min="0" max="1" name="face.photo.overlayOpacity"></label>
          </div>
          <label class="check"><input type="checkbox" name="face.photo.showDate"> Show date on overlay</label>
          <label class="check"><input type="checkbox" name="face.photo.showWeather"> Show weather on overlay</label>
          <button type="button" data-test="icloud" data-photo-source="icloud">Test iCloud</button>
          <button type="button" data-test="immich" data-photo-source="immich">Test Immich</button>
          <output id="photoStatus"></output>
        </section>

        <section>
          <h2>Brightness</h2>
          <p class="hint">Software dimming is implemented as a display opacity schedule. Hardware backlight control can be added in <code>src/server</code> for a specific screen driver.</p>
          <label class="check"><input type="checkbox" name="display.brightness.enabled"> Enable dimming schedule</label>
          <div class="grid">
            <label>Dim start <input type="time" name="display.brightness.dimStart"></label>
            <label>Dim end <input type="time" name="display.brightness.dimEnd"></label>
            <label>Dim opacity <input type="number" step="0.05" min="0.1" max="1" name="display.brightness.dimOpacity"></label>
          </div>
        </section>

        <section>
          <h2>Security</h2>
          <label>New admin password <input type="password" name="admin.password" minlength="8" autocomplete="new-password"></label>
        </section>

        <div class="actions">
          <button type="submit">Save configuration</button>
          <output id="saveStatus"></output>
        </div>
      </form>

      <aside class="preview">
        <h2>Preview</h2>
        <iframe src="/" title="Current clock preview"></iframe>
      </aside>
    </main>

    <script type="module" src="/static/js/admin.js"></script>
  </body>
</html>
